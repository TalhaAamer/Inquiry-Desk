<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget test page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #1a1f36; line-height: 1.5; }
    code { background: #eef1f8; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Widget test page</h1>
  <p>This page stands in for your own website. Open it as <code>/widget-test.html?site=YOUR_SITE_ID</code> and use the button in the corner. Your connection must list <code>http://localhost:3000</code> as an allowed website.</p>
  <p id="note"></p>
  <script>
    var site = new URLSearchParams(location.search).get("site");
    var note = document.getElementById("note");
    if (!site) {
      note.textContent = "Add ?site=YOUR_SITE_ID to the address to load the widget.";
    } else {
      var s = document.createElement("script");
      s.src = "/widget.js";
      s.setAttribute("data-site", site);
      document.body.appendChild(s);
      note.textContent = "Widget loaded for site " + site + ".";
    }
  </script>
</body>
</html>
